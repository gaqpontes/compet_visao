plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.posetracker'
version = '1.0.0'

android {
  namespace "expo.modules.posetracker"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

  // Minimum patched versions for transitive MediaPipe dependencies.
  constraints {
    implementation('com.google.code.gson:gson:2.8.9') {
      because 'CVE-2022-25647: prevent deserialization of internal classes'
    }
    implementation('com.google.protobuf:protobuf-javalite:4.27.5') {
      because 'CVE-2024-7254: bound recursion on unknown fields'
    }
    implementation('commons-io:commons-io:2.14.0') {
      because 'CVE-2021-29425 and CVE-2024-47554: traversal and XML resource limits'
    }
  }

  // MediaPipe Tasks Vision
  implementation 'com.google.mediapipe:tasks-vision:0.10.14'

  // CameraX
  def camerax_version = "1.3.4"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
}
